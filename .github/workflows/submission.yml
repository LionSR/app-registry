# Checks and reviews submission issues opened by the registry's GitHub App.
# The decision logic lives in registry/scripts/submission.py; this file only runs it and applies the plan.
# Secrets: COPILOT_PAT (a token from an account with Copilot) enables the AI review. Without it,
# every submission that passes the checks waits for an editor.
name: Submission

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

# One run at a time, so two accepts can never take the same ID.
concurrency:
  group: registry
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write # to start the site deploy after listing a paper

jobs:
  handle:
    # Only issues the registry app opened, and only commands in comments.
    if: >-
      github.event.issue.user.login == vars.REGISTRY_BOT_LOGIN &&
      !github.event.issue.pull_request &&
      (github.event_name == 'issues' || startsWith(github.event.comment.body, '/'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      REGISTRY_BOT_LOGIN: ${{ vars.REGISTRY_BOT_LOGIN }}
      SITE_URL: ${{ vars.SITE_URL }}
      AUTO_LIST: ${{ vars.AUTO_LIST || 'true' }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check the submission
        id: decide
        run: |
          python registry/scripts/submission.py --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" > plan.json
          cat plan.json
          echo "review=$(jq -r 'if .review then "true" else "false" end' plan.json)" >> "$GITHUB_OUTPUT"

      # Every check passed: an AI review by Copilot decides between listing now and asking an editor.
      # Copilot gets no tools, and the submission is passed as untrusted data (registry/review-prompt.md).
      - uses: actions/setup-node@v6
        if: steps.decide.outputs.review == 'true' && env.COPILOT_GITHUB_TOKEN != ''
        with:
          node-version: '22'
      - name: Install Copilot CLI
        if: steps.decide.outputs.review == 'true' && env.COPILOT_GITHUB_TOKEN != ''
        run: npm install -g @github/copilot
      - name: AI review (GitHub Copilot)
        id: review
        if: steps.decide.outputs.review == 'true' && env.COPILOT_GITHUB_TOKEN != ''
        continue-on-error: true
        uses: actions/ai-inference@v3
        with:
          system-prompt-file: registry/review-prompt.md
          prompt-file: review-input.txt
          model: ''
      - name: Finish the decision
        if: steps.decide.outputs.review == 'true'
        env:
          REVIEW_FILE: ${{ steps.review.outputs.response-file }}
        run: |
          python registry/scripts/submission.py --finalize plan.json --review "${REVIEW_FILE:-none}" > final.json
          mv final.json plan.json
          cat plan.json

      - name: Apply
        run: |
          set -euo pipefail
          [ "$(jq -r .act plan.json)" = true ] || { echo "Nothing to do: $(jq -r '.reason // ""' plan.json)"; exit 0; }

          entry=$(jq -r '.entry_path // empty' plan.json)
          if [ -n "$entry" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$entry"
            jq -r .commit_message plan.json | git commit -F -
            git push
            gh workflow run deploy.yml --ref main
          fi

          for label in $(jq -r '.labels_remove[]?' plan.json); do
            gh issue edit "$ISSUE" --remove-label "$label" 2>/dev/null || true
          done
          for label in $(jq -r '.labels_add[]?' plan.json); do
            gh label create "$label" --force >/dev/null
            gh issue edit "$ISSUE" --add-label "$label"
          done

          jq -r '.comment // empty' plan.json > comment.md
          [ -s comment.md ] && gh issue comment "$ISSUE" --body-file comment.md

          close=$(jq -r '.close // empty' plan.json)
          if [ -n "$close" ] && [ "$(gh issue view "$ISSUE" --json state -q .state)" = OPEN ]; then
            gh issue close "$ISSUE" --reason "$close"
          fi
